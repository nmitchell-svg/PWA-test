[build]
  publish = "public"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/push-config"
  to = "/.netlify/functions/push-config"
  status = 200
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
[[redirects]]
  from = "/api/send-push"
  to = "/.netlify/functions/send-push"
  status = 200
